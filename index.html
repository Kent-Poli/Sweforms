<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SweForms | Bygg, golvteknik & form i Västerås</title>
  <meta name="description" content="SweForms samlar byggtjänster, golvteknisk rådgivning och kreativ form. Måleri, avjämning, golvteknik, 3D-print och design." />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#071519" />
  <link rel="canonical" href="https://sweforms.se/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#071519;
      --text:#eef7f8;
      --muted:#a6bbc0;
      --gold:#58c4cf;
      --line:rgba(255,255,255,.09);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
    body{min-height:100vh;overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    .portal-shell{min-height:100vh;display:flex;flex-direction:column}
    .portal-header{
      height:78px;display:flex;align-items:center;justify-content:space-between;
      padding:0 max(16px,calc((100vw - 1240px)/2));border-bottom:1px solid var(--line);
      background:linear-gradient(90deg,rgba(14,47,56,.96),rgba(14,47,56,.96));backdrop-filter:blur(16px);
      position:sticky;top:0;z-index:60;box-shadow:0 10px 32px rgba(0,0,0,.16)
    }
    .portal-brand{display:flex;align-items:center}
    .portal-brand img{display:block;width:174px;max-height:48px;height:auto;object-fit:contain}
    .portal-nav-toggle{display:none;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
    .portal-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .portal-nav a{padding:10px 14px;border-radius:999px;color:var(--muted);font-size:.86rem;transition:.2s ease}
    .portal-nav a:hover,.portal-nav a.active{background:rgba(255,255,255,.05);color:var(--text)}
    .portal-nav a.cta{background:linear-gradient(180deg,var(--gold),#087e8b);color:#071519;font-weight:800}
    .portal-grid{
      flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
      min-height:calc(100vh - 78px)
    }
    .portal-choice{
      --x:50%;--y:50%;--dx:0px;--dy:0px;
      position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:flex-end;
      padding:clamp(28px,5vw,72px);background:#0a1c22;min-width:0;
      transition:background .35s ease
    }
    .portal-choice::before{
      content:"";position:absolute;inset:0;z-index:-3;
      background:
        radial-gradient(circle 300px at var(--x) var(--y),rgba(88,196,207,.20),transparent 68%),
        linear-gradient(145deg,rgba(255,255,255,.025),transparent 52%);
      opacity:.72;transition:opacity .35s ease
    }
    .portal-choice.form::before{
      background:
        radial-gradient(circle 300px at var(--x) var(--y),rgba(88,196,207,.18),transparent 68%),
        linear-gradient(145deg,rgba(255,255,255,.025),transparent 52%)
    }
    .portal-gridlines{
      position:absolute;inset:-12%;z-index:-4;opacity:.20;pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
      background-size:48px 48px;
      transform:perspective(700px) rotateX(58deg) translate3d(calc(var(--dx)*.45),calc(var(--dy)*.45),0);
      transform-origin:center 70%;transition:transform .14s ease-out
    }
    .portal-orb{
      position:absolute;width:240px;height:240px;border:1px solid rgba(88,196,207,.40);
      border-radius:38%;right:10%;top:16%;z-index:-1;
      transform:translate3d(calc(var(--dx)*.7),calc(var(--dy)*.7),0) rotate(18deg);
      transition:transform .16s ease-out,border-color .3s ease,border-radius .3s ease
    }
    .form .portal-orb{
      border-radius:50%;border-color:rgba(88,196,207,.38)
    }
    .portal-orb::before,.portal-orb::after{
      content:"";position:absolute;inset:22px;border:1px solid rgba(255,255,255,.10);border-radius:inherit
    }
    .portal-orb::after{inset:48px;border-color:rgba(255,255,255,.07)}
    .portal-copy{position:relative;z-index:2;max-width:700px;transform:translate3d(calc(var(--dx)*.10),calc(var(--dy)*.10),0);transition:transform .14s ease-out}
    .portal-label{display:block;font-size:.7rem;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
    .portal-title{
      display:flex;align-items:flex-end;gap:18px;margin:0;
      font-size:clamp(4.6rem,11vw,10rem);line-height:.76;letter-spacing:-.075em
    }
    .portal-arrow{
      font-size:clamp(2rem,4vw,4rem);font-weight:400;color:var(--gold);
      transform:translateY(-8px);transition:transform .3s ease
    }
    .form .portal-arrow{color:#58c4cf}
    .portal-desc{margin:24px 0 0;max-width:44ch;color:#b3c4c8;font-size:clamp(.95rem,1.3vw,1.15rem)}
    .portal-choice:hover::before{opacity:1}
    .portal-choice:hover .portal-arrow{transform:translate(9px,-14px)}
    .portal-choice:hover .portal-orb{border-radius:50%;border-color:rgba(255,255,255,.25)}
    .portal-choice:focus-visible{outline:2px solid var(--gold);outline-offset:-3px}
    @media(max-width:760px){
      body{overflow:auto}
      .portal-header{height:78px;padding:0 16px}
      .portal-nav-toggle{display:inline-flex}
      .portal-nav{display:none;position:absolute;top:calc(100% + 10px);left:16px;right:16px;padding:12px;border-radius:18px;background:rgba(14,47,56,.98);border:1px solid var(--line);box-shadow:0 24px 80px rgba(0,0,0,.35);flex-direction:column;align-items:stretch}
      .portal-nav.open{display:flex}
      .portal-grid{grid-template-columns:1fr;min-height:calc(100vh - 78px)}
      .portal-choice{min-height:46vh;padding:30px 22px}
      .portal-orb{width:150px;height:150px;right:4%;top:12%}
      .portal-title{font-size:clamp(4rem,22vw,6.8rem)}
      .portal-desc{max-width:30ch}
    }
    @media(prefers-reduced-motion:reduce){
      .portal-choice,.portal-copy,.portal-gridlines,.portal-orb,.portal-arrow{transition:none}
    }
  </style>
  <meta property="og:title" content="SweForms | Bygg, golvteknik & form i Västerås" />
  <meta property="og:description" content="SweForms samlar byggtjänster, golvteknisk rådgivning och kreativ form. Måleri, avjämning, golvteknik, 3D-print och design." />

<style>.brand img,.portal-brand img,.brand-mark img{background:#fff;border-radius:5px;padding:5px 8px;width:174px;height:58px;max-height:58px;object-fit:contain;display:block} :root{--brand-petrol:#087e8b}</style>
</head>
<body>
  <div class="portal-shell">
    <header class="portal-header">
      <a class="portal-brand" href="./" aria-label="SweForms startsida">
        <img src="images/sweforms-logo.svg" alt="SweForms" />
      </a>
      <button class="portal-nav-toggle" id="navToggle" aria-expanded="false" aria-controls="siteNav">Meny</button>
      <nav class="portal-nav" id="siteNav" aria-label="Huvudmeny">
        <a href="bygg/">Bygg</a>
        <a href="form/">Form</a>
        <a href="om.html">Om</a>
        <a href="offert.html" class="cta">Kontakt</a>
      </nav>
    </header>

    <main class="portal-grid" aria-label="Välj område">
      <a class="portal-choice build" href="bygg/" data-portal-choice>
        <span class="portal-gridlines" aria-hidden="true"></span>
        <span class="portal-orb" aria-hidden="true"></span>
        <div class="portal-copy">
          <span class="portal-label">Måleri · Avjämning · Golvteknik</span>
          <h1 class="portal-title">BYGG <span class="portal-arrow" aria-hidden="true">↗</span></h1>
          <p class="portal-desc">Praktiska tjänster och golvteknisk kunskap för företag och projekt.</p>
        </div>
      </a>

      <a class="portal-choice form" href="form/" data-portal-choice>
        <span class="portal-gridlines" aria-hidden="true"></span>
        <span class="portal-orb" aria-hidden="true"></span>
        <div class="portal-copy">
          <span class="portal-label">3D · Design · Objekt · Digitalt</span>
          <h1 class="portal-title">FORM <span class="portal-arrow" aria-hidden="true">↗</span></h1>
          <p class="portal-desc">Kreativt skapande där idéer blir digitala och fysiska former.</p>
        </div>
      </a>
    </main>
  </div>

  <script>
    const navToggle = document.getElementById('navToggle');
    const siteNav = document.getElementById('siteNav');
    if (navToggle && siteNav) {
      navToggle.addEventListener('click', () => {
        const open = siteNav.classList.toggle('open');
        navToggle.setAttribute('aria-expanded', String(open));
      });
    }

    document.querySelectorAll('[data-portal-choice]').forEach((choice) => {
      if (!window.matchMedia('(pointer:fine)').matches) return;
      choice.addEventListener('pointermove', (e) => {
        const r = choice.getBoundingClientRect();
        const nx = (e.clientX - r.left) / r.width;
        const ny = (e.clientY - r.top) / r.height;
        choice.style.setProperty('--x', (nx * 100).toFixed(1) + '%');
        choice.style.setProperty('--y', (ny * 100).toFixed(1) + '%');
        choice.style.setProperty('--dx', ((nx - .5) * 24).toFixed(2) + 'px');
        choice.style.setProperty('--dy', ((ny - .5) * 18).toFixed(2) + 'px');
      });
      choice.addEventListener('pointerleave', () => {
        choice.style.setProperty('--x','50%');
        choice.style.setProperty('--y','50%');
        choice.style.setProperty('--dx','0px');
        choice.style.setProperty('--dy','0px');
      });
    });
  </script>
</body>
</html>
